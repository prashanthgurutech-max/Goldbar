name: BLINKDEAL6 switch
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Is BLINKDEAL6 live on Myntra right now?'
        type: choice
        options: ['true', 'false']
        default: 'true'
permissions:
  contents: write
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/set_blinkdeal.mjs
        env:
          LIVE: ${{ github.event.inputs.live }}
      - name: Commit changes
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data/offers.json
          git diff --cached --quiet || (git commit -m "BLINKDEAL6 switch" && git pull --rebase && git push)
