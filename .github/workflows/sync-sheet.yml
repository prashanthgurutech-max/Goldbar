name: Sync prices from Google Sheet
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: data-writes

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: sync
        run: node scripts/sync_sheet.mjs
        continue-on-error: true
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/listings.json data/sheet_sync_state.json
          git diff --cached --quiet || (git commit -m "Sync prices from sheet" && git pull --rebase && git push)
      - name: Fail the run if something needs your attention, so GitHub emails you
        if: steps.sync.outcome == 'failure'
        run: |
          echo "The sheet sync needs attention. See the summary above."
          exit 1
