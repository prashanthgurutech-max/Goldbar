name: Update gold and silver rates
on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '41 5 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update_rates.mjs
      - name: Commit changes
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update rates" && git push
