<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold tracker – GoldRadar</title>
<meta name="description" content="Keep a private record of the gold you bought and see its value today. Saved only on your device.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261006a"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0b0d12"></head><body>
<header class="top"><div class="wrap bar"><div class="brand"><span class="dot"></span><b>GoldRadar</b></div><a class="back" href="./" data-i18n>← Back to prices</a><button class="lang" type="button" data-share data-i18n>Share</button><select id="langSel" class="lang" aria-label="Language"></select></div></header>
<main class="page"><h1 data-i18n>Gold tracker</h1><p class="mut" data-i18n>Stored only on this device. Clear your browser data and it is gone, so download a backup now and then.</p>
<section class="calc"><h2 data-i18n>Add purchase</h2>
<div class="fields"><label><span data-i18n>Date</span><input id="d" type="date"></label><label><span data-i18n>Weight (g)</span><input id="w" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label><span data-i18n>Purity (K)</span><select id="k"><option>24</option><option>22</option><option>18</option><option>14</option></select></label>
<label><span data-i18n>Price paid (₹)</span><input id="p" type="number" min="0" inputmode="decimal"></label><label><span data-i18n>Note (optional)</span><input id="n" type="text" maxlength="60"></label></div>
<button id="add" class="btn" type="button" data-i18n>Add</button><p class="mut" id="err" style="color:var(--red)"></p></section>
<section class="calc"><h2 data-i18n>Your holdings</h2><label style="max-width:240px"><span data-i18n>City</span><select id="citySel"></select></label>
<div class="res" id="sum"></div><div class="tablewrap"><table id="tbl"></table></div>
<p class="mut" style="font-size:12px" data-i18n>Value uses today's gold rate. A jeweller or store will usually pay less after deductions.</p>
<div class="acts" style="justify-content:flex-start"><a href="#" id="dl" data-i18n>Download backup</a><label class="filebtn"><span data-i18n>Restore backup</span><input id="up" type="file" accept="application/json" hidden></label></div></section>
</main><script src="translations.js?v=20261006a"></script><script src="i18n.js?v=20261006a"></script><script src="share.js?v=20261006a"></script><script src="lib.js?v=20261006a"></script><script src="tracker.js?v=20261006a"></script></body></html>
